info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/auth/register
  body:
    type: json
    data: |-
      {
        "email": "interviewer@example.com",
        "name": "InterviewerUser",
        "password": "Interpassword123",
        "role": "INTERVIEWER"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
